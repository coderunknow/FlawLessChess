# fmt-apply.yml — tooling: apply rustfmt on the current branch and push the result.
#
# The sandbox used for this iteration cannot read the Actions log host
# (results-receiver.actions.githubusercontent.com is unreachable), so a `cargo fmt --check`
# failure is not directly readable. This manual job applies the pinned formatter and pushes
# the result to the same branch, which makes the formatting gate verifiable.
#
# Manual dispatch only. It never touches `main` and never force-pushes.

name: Format apply (tooling)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to format and commit to (defaults to the dispatch ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  fmt:
    name: Apply rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned from master on 2026-11-20
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit and push the formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no formatting changes were needed"
            exit 0
          fi
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:${{ inputs.branch || github.ref_name }}"
