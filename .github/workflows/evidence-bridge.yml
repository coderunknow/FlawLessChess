# evidence-bridge.yml — collect raw per-game evidence from EXISTING rating-run
# executions (runs that predate the in-run `evidence` job, or any re-run) and
# commit it to the PR branch. Same deliberate-dispatch discipline as rating-run:
# the workflow fires only when the marker file `benches/evidence-request.json`
# moves in the top commit of a push (see rating-run.yml resolve for the gate).
#
# Each entry maps ONE completed rating-run execution to ONE disjoint evidence
# directory. The run must be completed AND successful before its artifacts are
# aggregated; every identity check is the strict aggregator's (fail closed).
# Entries are never reused across different runs of the same shard identities —
# the aggregator rejects duplicate shard_ids within one aggregation, and the
# bridge keeps different runs in different evidence directories.

name: evidence-bridge

on:
  pull_request:
    paths:
      - "benches/evidence-request.json"

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Top-commit marker gate
        id: gate
        run: |
          if git diff --name-only HEAD~1 HEAD -- benches/evidence-request.json | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "top commit does not move benches/evidence-request.json — NOT a dispatch"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python + python-chess (pinned)
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install --user chess==1.11.2

      - name: Collect and aggregate evidence
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          req = json.load(open("benches/evidence-request.json"))
          if req.get("schema") != 1:
              sys.exit("evidence-request schema must be 1")
          pool = json.load(open("benches/anchor-pool.json"))

          def sha_of(slot, engine_sha):
              if slot == "flawless":
                  return engine_sha
              for e in pool["engines"]:
                  if e.get("key") == slot:
                      return e["sha256"]
              sys.exit(f"unknown engine slot {slot}")

          for ent in req["runs"]:
              run_id = str(ent["run_id"])
              # Fail closed on unusable shards: the run must be completed and EVERY
              # shard job successful. The run-level conclusion is deliberately not
              # required to be success: the in-run aggregate job fails on the
              # registered overwrite refusal when the B-suite run shares its label
              # with an already-committed A-suite evidence directory (the B-suite
              # evidence lands through THIS bridge instead), and the strict
              # aggregator below re-verifies identity and completeness fail-closed
              # on the raw shard artifacts either way.
              # Job listings are paginated: wedged runs accumulate 100+ retry
              # entries and a single ?per_page=100 page can hide the shard jobs
              # entirely (CodeRabbit review 2026-11-27). Fetch every page.
              jobs = []
              page = 1
              while True:
                  r = subprocess.run(
                      ["gh", "api",
                       f"repos/{os.environ.get('GITHUB_REPOSITORY', 'coderunknow/FlawLessChess')}"
                       f"/actions/runs/{run_id}/jobs?per_page=100&page={page}"],
                      capture_output=True, text=True)
                  chunk = (json.loads(r.stdout or "{}") or {}).get("jobs") or []
                  jobs.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              r2 = subprocess.run(
                  ["gh", "run", "view", run_id, "--json", "conclusion,status"],
                  capture_output=True, text=True)
              info = json.loads(r2.stdout or "{}")
              if info.get("status") != "completed":
                  sys.exit(f"run {run_id} not completed: {info}")
              # Identify shard jobs by their exact registered names
              # ({purpose}-{batch}-{anchor_id}-shard{index}). Substring matching
              # mislabeled any job whose name merely contained "-shard", and a
              # count-only check could pass while checking the wrong jobs
              # (CodeRabbit review 2026-11-27).
              wanted = {
                  f"{ent['purpose']}-{ent['batch']}-{ent['anchor_id']}-shard{i}": i
                  for i in ent["shard_indices"]
              }
              by_name = {}
              for j in jobs:
                  name = j.get("name") or ""
                  if name in wanted:
                      by_name.setdefault(name, []).append(j)
              missing = [n for n in wanted if n not in by_name]
              if missing:
                  sys.exit(f"run {run_id}: shard jobs missing: {missing[:5]}")
              bad = []
              for name in wanted:
                  attempts = sorted(by_name[name], key=lambda j: j.get("started_at") or "")
                  if attempts[-1].get("conclusion") != "success":
                      bad.append((name, attempts[-1].get("conclusion")))
              if bad:
                  sys.exit(f"run {run_id}: shard jobs not all successful: {bad[:5]}")
              dl = f"/tmp/bridge-{run_id}"
              subprocess.run(["gh", "run", "download", run_id, "-D", dl], check=True)
              # Attempt-specific completed-shard collection: a cancelled or aborted
              # shard leg uploads a partial artifact (meta.json completion_status
              # != completed). Those must never enter aggregation; only fully
              # completed shard artifacts are collected, and the expected count
              # is checked against the collected set (fail closed).
              dl_complete = f"/tmp/bridge-{run_id}-complete"
              r3 = subprocess.run(
                  [sys.executable, "scripts/collect_completed_shards.py",
                   "--source", dl, "--out", dl_complete],
                  capture_output=True, text=True)
              n_complete = (r3.stdout or "").strip().splitlines()[-1] if r3.stdout else "0"
              if r3.returncode != 0:
                  sys.exit(f"collect_completed_shards failed for run {run_id}: {r3.stderr[-500:]}")
              want = len(ent["shard_indices"])
              if int(n_complete) != want:
                  sys.exit(f"run {run_id}: {n_complete} completed shard artifacts, entry expects {want}")
              dl = dl_complete
              out = f"benches/evidence/{ent['evidence_purpose']}/{ent['anchor_id']}"
              os.makedirs(out, exist_ok=True)
              cmd = [
                  sys.executable, "scripts/aggregate_shards.py",
                  "--shards-root", dl,
                  "--batch", ent["batch"],
                  "--anchor", ent["anchor_id"],
                  "--engine-sha256", sha_of(ent["white_engine"], ent["engine_sha256"]),
                  "--anchor-sha256", sha_of(ent["black_engine"], ent["engine_sha256"]),
                  "--opening-suite-sha256", ent["opening_suite_sha256"],
                  "--tc-moves", str(ent["tc_moves"]),
                  "--tc-seconds", str(ent["tc_seconds"]),
                  "--expected-shards", str(len(ent["shard_indices"])),
                  "--out", f"{out}/games.jsonl",
                  "--manifest", f"{out}/manifest.json",
              ]
              print("invoking:", " ".join(cmd), flush=True)
              rc = subprocess.call(cmd)
              if rc != 0:
                  print(f"::error::aggregate failed for run {run_id} (fail closed)")
                  sys.exit(rc)
              print(f"collected run {run_id} -> {out}")
          PY

      - name: Commit evidence to the branch
        if: steps.gate.outputs.run == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "flawless-evidence-bot"
          git config user.email "flawless-evidence-bot@users.noreply.github.com"
          # SAFEGUARD: evidence pushes are only ever allowed to the PR's arena
          # working branch. Anything else (e.g. main, another PR) is refused.
          case "$BRANCH" in
            arena/*) ;;
            *) echo "::error::refusing to push to non-arena branch '$BRANCH'"; exit 1 ;;
          esac
          git add benches/evidence
          if git diff --cached --quiet; then
            echo "no new evidence to commit"; exit 0
          fi
          git commit -m "evidence: raw per-game results via evidence-bridge (request revision $(python3 -c "import json;print(json.load(open('benches/evidence-request.json'))['revision'])"))"
          # NOTE: actions/checkout with ref=<head sha> leaves this job in
          # DETACHED HEAD state — "git push origin $BRANCH" is a refspec that
          # matches no local branch and fails with "src refspec ... does not
          # match any". Publish with an EXPLICIT refspec instead, and rebase
          # onto the verified remote tip if a concurrent evidence commit
          # advanced the branch (a rebase that drops our patch-identical
          # commit makes the retry a no-op push — safe and idempotent).
          git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          echo "remote tip: $(git rev-parse --verify "origin/$BRANCH")"
          for i in 1 2 3 4 5; do
            echo "push attempt $i: HEAD=$(git rev-parse HEAD) origin/$BRANCH=$(git rev-parse origin/$BRANCH)"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "evidence commit $(git rev-parse HEAD) pushed to refs/heads/$BRANCH"
              exit 0
            fi
            git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "::error::push failed but origin/$BRANCH is an ancestor of HEAD — unexpected remote state"
              exit 1
            fi
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort
              echo "::error::evidence rebase onto origin/$BRANCH failed"
              exit 1
            fi
            sleep $((10 * i))
          done
          echo "::error::evidence push failed after retries"
          exit 1

      # Defense in depth: mirror the aggregate even if the commit/push step
      # above fails, so an Actions-side aggregation is never lost again.
      - name: Upload aggregate artifact (mirror)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-evidence-mirror-${{ github.run_id }}
          path: benches/evidence/
          if-no-files-found: warn
          retention-days: 90
