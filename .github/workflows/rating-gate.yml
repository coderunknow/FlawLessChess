# rating-gate.yml — the FAIL-CLOSED gate check for the >2,000 Elo mission
# (docs/RATING_PROTOCOL.md §9). Job name `rating-gate` is stable.
#
# It evaluates COMMITTED raw evidence (benches/evidence/**, produced by the
# rating-run `evidence` job / evidence-bridge from hash-verified runner
# artifacts) against the PREREGISTERED machine plan (benches/gate-plan.json,
# committed together with the Batch A/B preregistration). It may return
# SUCCESS only when ALL of:
#   * scripts/verify_evidence.py verifies every planned (batch, anchor) and
#     control evidence directory: frozen binary hashes, opening-suite hash,
#     merged_sha256 vs the committed bytes, game-record integrity, counted
#     totals >= the plan minimum (fail closed on ANY mismatch)
#   * >= 3 eligible anchors; the registered counted games per anchor per batch
#     (benches/gate-plan.json: currently 240 = 60 opening clusters x 4)
#   * Batch A, Batch B and the combined estimate all have two-sided 95%
#     calibrated CI lower bounds STRICTLY > 2,000 (unrounded)
#   * both null controls pass their registered thresholds
# The estimator RECOMPUTES everything from the raw games.jsonl evidence — it
# never trusts a manually entered rating number. Missing evidence fails closed.
# No step uses continue-on-error. Until benches/gate-plan.json exists (batch
# preregistration), this check FAILS CLOSED by design.
#
# Local reproducibility (any checkout of this branch):
#   python3 scripts/verify_evidence.py --plan benches/gate-plan.json
#   python3 scripts/rating_estimator.py gate --anchor-json benches/anchor-pool.json ...

name: rating-gate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["rating-run"]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/rating-gate.yml"
      - "benches/evidence/**"
      - "benches/gate-plan.json"
      - "benches/anchor-pool.json"
      - "scripts/rating_estimator.py"
      - "scripts/verify_evidence.py"
      - "scripts/aggregate_shards.py"
      - "scripts/reduced_sample.py"
      - "scripts/make_gate_plan.py"
      - "scripts/merge_batch_runs.py"
      - "scripts/try_merge_confirmatory.py"
      - "scripts/make_batch_dispatch.py"
      - "scripts/verify_opening_subsets.py"
      - "benches/rating-openings-100-batchA.txt"
      - "benches/rating-openings-100-batchB.txt"
      - "benches/rating-100-power-assessment.json"
      - "benches/rating-openings-batchA.txt"
      - "benches/rating-openings-batchB.txt"
      - "benches/rating-100-power-assessment-e4.json"

permissions:
  contents: read

jobs:
  rating-gate:
    name: rating-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python + python-chess (pinned)
        run: python3 -m pip install --user chess==1.11.2

      - name: Verify committed evidence against the preregistered plan (fail closed)
        run: |
          set -euo pipefail
          if [ ! -f benches/gate-plan.json ]; then
            echo "rating-gate: FAIL — benches/gate-plan.json missing (batches not yet preregistered)."
            echo "This check fails closed until Batch A/B are registered and their evidence is committed."
            exit 1
          fi
          python3 scripts/verify_evidence.py --plan benches/gate-plan.json --pool benches/anchor-pool.json

      # Independent recomputation from raw evidence. Exits non-zero unless all
      # three lower CI bounds (A, B, combined) are strictly > 2000, every anchor
      # is within the saturation limit with the registered per-anchor counted
      # games and opening clusters (240/60x4 per benches/gate-plan.json), and
      # both null controls pass.
      - name: rating estimator gate (independent recomputation, fail closed)
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/gate-args.txt
          import json
          plan = json.load(open("benches/gate-plan.json"))
          def pair(b):
              return " ".join(f"{a}=benches/evidence/batch{b}/{a}/games.jsonl"
                              for a in plan["batches"][b]["anchors"])
          ctl = plan["controls"]
          print(f"--anchor-json benches/anchor-pool.json")
          print(f"--focus {plan['focus']}")
          print(f"--batch-a {pair('A')}")
          print(f"--batch-b {pair('B')}")
          print(f"--control-anchor {ctl['anchor_vs_anchor']['evidence']}")
          print(f"--control-anchor-names {ctl['anchor_vs_anchor']['names'][0]} {ctl['anchor_vs_anchor']['names'][1]}")
          print(f"--control-self {ctl['self_match']['evidence']}")
          print(f"--min-games {plan['min_games']}")
          if plan.get("exact_counted_games") is not None:
              print(f"--exact-games {plan['exact_counted_games']}")
              print(f"--required-openings {plan['required_openings']}")
              print(f"--games-per-opening {plan['games_per_opening']}")
              print(f"--suite-a {plan['batches']['A']['suite_path']}")
              print(f"--suite-b {plan['batches']['B']['suite_path']}")
          print(f"--threshold {plan['threshold']}")
          print(f"--bootstrap {plan.get('bootstrap', 10000)}")
          print(f"--seed {plan.get('bootstrap_seed', 20261114)}")
          print("--out benches/evidence/rating-gate-result.json")
          PY
          python3 scripts/rating_estimator.py gate $(tr '\n' ' ' < /tmp/gate-args.txt)

      - name: Upload machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rating-gate-result-${{ github.run_id }}
          path: benches/evidence/rating-gate-result.json
          if-no-files-found: warn
          retention-days: 90
