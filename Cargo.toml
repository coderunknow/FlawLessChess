[package]
name = "flawless"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Flawless — an independent chess engine written in Rust (not a Stockfish derivative)"
license = "Apache-2.0"
repository = "https://github.com/coderunknow/FlawLessChess"
publish = false

[dependencies]
# Zero external dependencies by design (offline build; minimal audit surface).

[profile.release]
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

[profile.bench]
inherits = "release"
